apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-scheduler-extender
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: energy-scheduler-extender
  template:
    metadata:
      labels:
        app: energy-scheduler-extender
    spec:
      containers:
      - name: extender
        image: python:3.9
        workingDir: /app
        command: ["/bin/bash", "-c"]
        args:
          - |
            # Pre-install dependencies to avoid health check timeouts
            pip install flask scikit-learn pandas requests joblib && \
            python energy_scheduler_extender.py
        ports:
        - containerPort: 8080
        env:
        - name: PROMETHEUS_URL
          value: "http://prometheus-operated.monitoring.svc:9090"
        resources:
          requests:
            memory: "512Mi"  # Increased memory
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "800m"
        # Remove liveness/readiness probes temporarily
        # livenessProbe:
        #   httpGet:
        #     path: /health
        #     port: 8080
        #   initialDelaySeconds: 120  # Much longer delay
        #   periodSeconds: 30
        # readinessProbe:
        #   httpGet:
        #     path: /health
        #     port: 8080
        #   initialDelaySeconds: 90
        #   periodSeconds: 20
        volumeMounts:
        - name: app-volume
          mountPath: /app
      volumes:
      - name: app-volume
        configMap:
          name: energy-scheduler-config
